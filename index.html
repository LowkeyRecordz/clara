<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클라라음악학원 블로그 포스트 생성기</title>
<style>
:root{
  --pink:#ff8fab; --pink-light:#ffe5ec; --cream:#fff8f3; --ink:#3a2e2e;
  --sub:#8a7a7a; --line:#f3d9e0; --btn-brand:#ff8fab; --btn-seo:#7cc6a4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.7;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:720px;margin:0 auto;}
header{text-align:center;margin-bottom:22px;}
header h1{font-size:22px;margin:0 0 6px;}
header p{color:var(--sub);font-size:14px;margin:0;}
.btn-row{display:flex;gap:10px;margin-bottom:20px;}
.gen-btn{
  flex:1;padding:16px 10px;border:none;border-radius:16px;font-size:15px;font-weight:700;
  color:#fff;cursor:pointer;transition:transform .1s;box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.gen-btn:active{transform:scale(.97);}
.brand-btn{background:linear-gradient(135deg,#ff8fab,#ff6f9c);}
.seo-btn{background:linear-gradient(135deg,#7cc6a4,#57ad84);}
.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;
  display:none;
}
.card.show{display:block;}
.card h2{font-size:18px;margin:0 0 10px;}
.copy-row{display:flex;gap:8px;margin:10px 0 16px;}
.copy-btn{
  flex:1;padding:10px;border:1px solid var(--pink);background:var(--pink-light);color:#c23566;
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
}
.copy-btn.copied{background:#7cc6a4;border-color:#7cc6a4;color:#fff;}
.post-body p{white-space:pre-wrap;font-size:14.5px;margin:0 0 14px;}
.post-body img{max-width:100%;border-radius:12px;display:block;margin:6px 0 4px;}
.cap{font-size:12px;color:var(--sub);margin:0 0 14px;}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 0;}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--cream:#221c1c;--ink:#f2e8e8;--sub:#c9b8b8;--line:#3a2e2e;}
  :root:not([data-theme="light"]) .card{background:#2c2424;}
  :root:not([data-theme="light"]) .copy-btn{background:#3a2830;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🎹 클라라음악학원 포스트 생성기</h1>
<p>버튼 하나로 완성되는 제목 + 본문 :) 사진도 바로 떠요!</p>
</header>

<div class="btn-row">
  <button class="gen-btn brand-btn" onclick="generate('brand')">🎹 학원 홍보용</button>
  <button class="gen-btn seo-btn" onclick="generate('seo')">🔍 키워드 유입용</button>
</div>

<div class="card" id="card">
  <h2 id="postTitle"></h2>
  <div class="copy-row">
    <button class="copy-btn" id="copyTitleBtn" onclick="copyText('title')">제목 복사 📋</button>
    <button class="copy-btn" id="copyBodyBtn" onclick="copyText('body')">본문 복사 📋</button>
  </div>
  <div class="post-body" id="postBody"></div>
</div>
<div class="empty" id="emptyMsg">위 버튼을 눌러보세요! 제목과 본문, 어울리는 사진까지 한 번에 만들어드려요 😊</div>

<footer>클라라음악학원 · 강서구 마곡 · 02-2667-5979</footer>
</div>

<script>
const DB = JSON.parse(document.getElementById('data-blob').textContent);
const used = { brand: [], seo: [] };
let current = { title: '', bodyText: '' };

function pickImage(cat, hint){
  const list = DB.images[cat] || [];
  if(!list.length) return null;
  let pool = list;
  if(hint){
    const filtered = list.filter(im => im.name.includes(hint));
    if(filtered.length) pool = filtered;
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function pickSecondImage(excludeCat){
  const cats = Object.keys(DB.images).filter(c => c !== excludeCat);
  const cat = cats[Math.floor(Math.random()*cats.length)];
  return { img: pickImage(cat), cat };
}

function nextTopic(kind){
  const topics = DB[kind];
  if(used[kind].length >= topics.length) used[kind] = [];
  const remaining = topics.map((t,i)=>i).filter(i => !used[kind].includes(i));
  const idx = remaining[Math.floor(Math.random()*remaining.length)];
  used[kind].push(idx);
  return topics[idx];
}

function generate(kind){
  const topic = nextTopic(kind);
  const img1 = pickImage(topic.cat, topic.img_hint);
  const second = pickSecondImage(topic.cat);

  let aboutText = DB.about;
  if(kind === 'seo'){
    aboutText = `${topic.kw}을(를) 찾고 계신다면, 강서구 마곡에 위치한 클라라음악학원을 소개해드리고 싶어요 🎹 수명산2단지 앞 파리바게트·농협건물 8층에 있어서 인근에서도 오가기 편하고, 전공자 선생님의 1:1 맞춤 레슨으로 초등부부터 성인까지 폭넓게 수업하고 있어요.`;
  }

  const paragraphs = [
    { text: topic.intro, img: img1 },
    { text: aboutText, img: second.img },
    { text: DB.strength, img: null },
    { text: DB.cta, img: null },
  ];

  document.getElementById('postTitle').textContent = topic.title;

  const bodyEl = document.getElementById('postBody');
  bodyEl.innerHTML = '';
  let plain = [];
  paragraphs.forEach(p => {
    const pEl = document.createElement('p');
    pEl.textContent = p.text;
    bodyEl.appendChild(pEl);
    plain.push(p.text);
    if(p.img){
      const im = document.createElement('img');
      im.src = p.img.data;
      im.alt = p.img.name;
      bodyEl.appendChild(im);
      const cap = document.createElement('p');
      cap.className = 'cap';
      cap.textContent = `📷 사진: ${p.img.name} (네이버 블로그에 이 사진을 첨부해주세요)`;
      bodyEl.appendChild(cap);
      plain.push(`[사진 첨부: ${p.img.name}]`);
    }
  });

  current.title = topic.title;
  current.bodyText = plain.join('\n\n');

  document.getElementById('card').classList.add('show');
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('copyTitleBtn').classList.remove('copied');
  document.getElementById('copyTitleBtn').textContent = '제목 복사 📋';
  document.getElementById('copyBodyBtn').classList.remove('copied');
  document.getElementById('copyBodyBtn').textContent = '본문 복사 📋';
  document.getElementById('card').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyText(which){
  const text = which === 'title' ? current.title : current.bodyText;
  const btn = document.getElementById(which === 'title' ? 'copyTitleBtn' : 'copyBodyBtn');
  const done = () => {
    btn.textContent = '복사 완료! ✅';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = (which==='title'?'제목 복사 📋':'본문 복사 📋'); btn.classList.remove('copied'); }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}
</script>
